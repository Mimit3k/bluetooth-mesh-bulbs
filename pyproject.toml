# Application metadata for the source release.
#
# This file intentionally has no [build-system]: the supported install path is
# a clone plus setup-linux.sh / setup-windows.ps1, because the app imports the
# vendored btmesh and phase0 trees from the checkout. A pipx/wheel build is a
# planned follow-up and will move these modules into a src/bulbctl package.
[project]
name = "bluetooth-mesh-bulbs"
version = "0.1.0"
description = "Desktop GUI and CLI for LEDVANCE SMART+ Bluetooth SIG-mesh lamps"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bluetooth-mesh-bulbs contributors" }]
keywords = ["bluetooth", "bluetooth-mesh", "ble", "lighting", "ledvance", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "cryptography>=42",
    "bleak>=0.22",
    "bleak-retry-connector>=3",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "phase0/tests"]
pythonpath = [".", "src", "phase0"]

[tool.ruff]
target-version = "py312"
exclude = [".venv", "src/btmesh", "phase0", "third_party"]

[tool.ruff.lint]
# Match the vendored library's deliberately small, stable rule set.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["bulbctl", "bulbgui", "meshcore"]
